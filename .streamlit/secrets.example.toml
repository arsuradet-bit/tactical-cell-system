# Copy these keys into Streamlit Settings > Secrets. Never commit real secrets.
APP_PASSWORD = "replace-with-a-new-password"

[database]
host = "YOUR_CLOUD_SQL_IP"
port = 5432
name = "postgres"
user = "YOUR_APP_DATABASE_USER"
password = "YOUR_NEW_DATABASE_PASSWORD"
sslmode = "require"
# If your Cloud SQL requires client certificates, also set:
# sslrootcert = "/path/to/server-ca.pem"
# sslcert = "/path/to/client-cert.pem"
# sslkey = "/path/to/client-key.pem"
